[project]
name = "retro-analytics"
version = "0.2.0"
description = "Rank retro video games by forecast PriceCharting price trend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
    "statsmodels>=0.14.2",
    "urllib3>=2",
]

[project.optional-dependencies]
sentiment = [
    "nltk>=3.9",
    "praw>=7.8",
]

[project.scripts]
ra = "retro_analytics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
